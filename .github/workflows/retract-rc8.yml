name: Retract RC8
on:
  push:
    branches: [maintenance/retract-rc8]
    paths: [.github/workflows/retract-rc8.yml]

permissions:
  contents: write

jobs:
  retract:
    if: github.repository == 'BastetEcho/habitica-android-no-popup'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only the withdrawn RC8 release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/rc8-retraction-venv"
          source "$RUNNER_TEMP/rc8-retraction-venv/bin/activate"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          REPO = "BastetEcho/habitica-android-no-popup"
          TAG = "v4.10.0-no-yesterdailies-rc.8"
          BASE = "https://api.github.com/repos/" + REPO
          HEADERS = {
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(path, method="GET"):
              """Returns status and parsed JSON for a scoped GitHub API request."""
              req = urllib.request.Request(BASE + path, headers=HEADERS, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  return error.code, None

          status, repo = request("")
          assert status == 200 and repo["full_name"] == REPO, "Repository check failed"
          status, release = request("/releases/tags/" + TAG)
          if status != 404:
              assert status == 200, "Release lookup failed"
              assert release["tag_name"] == TAG, "Unexpected release"
              assert release["prerelease"] and not release["draft"], "Unexpected release state"
              assert release["html_url"] == "https://github.com/" + REPO + "/releases/tag/" + TAG
              assets = release["assets"]
              assert any(
                  item["name"] == "habitica-4.10.0-offline-outbox-no-yesterdailies-rc8.apk"
                  and item["size"] == 51180816
                  for item in assets
              ), "Expected RC8 asset not found"
              release_id = release["id"]
              assert isinstance(release_id, int), "Invalid release id"
              status, _ = request("/releases/" + str(release_id), method="DELETE")
              assert status == 204, "Release deletion failed"
          status, _ = request("/releases/tags/" + TAG)
          assert status == 404, "RC8 is still published"
          print("RC8 release absent. No tags, branches, or other releases were modified.")
          PY
